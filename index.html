<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キャラソート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>キャラソート</h1>
  <p>好きなキャラを３人ずつ比較して順位づけしよう</p>
  <div id="sort-area"></div>
  <div id="controls">
    <button id="reset-rank">選択を解除する</button>
    <button id="submit-rank">順位を確定する</button>
    <button id="retire">途中終了する</button>
  </div>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
